# --- Server ---
server.port=8080

# --- Spring AI: Ollama (local models, no API key needed) ---
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=llama3.1
spring.ai.ollama.chat.options.temperature=0.7
spring.ai.ollama.embedding.model=nomic-embed-text
# Pull the models automatically on first run if missing
spring.ai.ollama.init.pull-model-strategy=when_missing

# --- Week 1: profiles, config, actuator ---
# No profile on the command line still activates dev (see application-dev.properties).
spring.profiles.default=dev

# In-memory database so @Transactional has a real transaction manager (Day 4).
spring.datasource.url=jdbc:h2:mem:week1;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# health and info are the production pair. metrics is on for the lab.
# env is intentionally NOT exposed: it would print notify.api-key.
management.endpoints.web.exposure.include=health,info,metrics
management.info.build.enabled=true

# --- Logging: watch tool calls happen ---
logging.level.org.springframework.ai=INFO
