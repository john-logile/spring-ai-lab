# Dev profile: log notifications locally. Switch away from this file with
# --spring.profiles.active=prod and the Java code stays the same.
notify.mode=LOG
notify.api-key=dev-local-key
notify.sender=dev@localhost

# Local lab: show the custom health component, plus info and metrics.
# Prod narrows this list. env stays off so notify.api-key is not dumped.
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health,info,metrics
