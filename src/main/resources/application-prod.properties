# Prod profile: same Notifier injection point, different implementation and settings.
notify.mode=EMAIL
notify.api-key=prod-key-change-me
notify.sender=alerts@example.com

# Production shape: liveness only, no config details, no metrics scrape on the public port.
management.endpoint.health.show-details=never
management.endpoints.web.exposure.include=health,info

